<ion-header class="custom-header">

  <div class="header-safe-area"></div>

  <div class="header-row">

    <ion-back-button
      defaultHref="/profile"
      class="header-back-button"
      aria-label="Regresar"
    ></ion-back-button>

    <h1 class="header-title">
      Editar perfil
    </h1>

  </div>

</ion-header>

<ion-content>

  <div class="dashboard-wrapper">

    <div class="sector-card profile-card">

      <div class="profile-icon">

        <ion-icon
          name="person-circle-outline"
        ></ion-icon>

      </div>

      <h2>
        Editar información
      </h2>

      <p>
        Actualiza los datos de tu cuenta
      </p>

    </div>

    <div class="sector-card form-card">

      <div class="input-group">

        <ion-label>
          Nombre de usuario
        </ion-label>

        <ion-input
          type="text"
          fill="outline"
          placeholder="Escribe tu nombre de usuario"
          [value]="userName"
          (ionInput)="actualizarNombre($event)"
        ></ion-input>

      </div>

      <div class="input-group">

        <ion-label>
          Correo electrónico
        </ion-label>

        <ion-input
          type="email"
          fill="outline"
          placeholder="Escribe tu correo electrónico"
          [value]="userEmail"
          (ionInput)="actualizarCorreo($event)"
        ></ion-input>

      </div>

      <div class="input-group">

        <ion-label>
          Nueva contraseña
        </ion-label>

        <ion-input
          type="password"
          fill="outline"
          placeholder="Déjala vacía para no cambiarla"
          [value]="newPassword"
          (ionInput)="actualizarPassword($event)"
        >
          <ion-input-password-toggle
            slot="end"
          ></ion-input-password-toggle>
        </ion-input>

        <p class="input-help">
          Completa este campo solamente si quieres
          cambiar tu contraseña.
        </p>

      </div>

    </div>

    <div class="form-actions">

      <ion-button
        expand="block"
        class="action-btn btn-save"
        [disabled]="isLoading"
        (click)="guardarCambios()"
      >
        {{
          isLoading
            ? 'GUARDANDO...'
            : 'GUARDAR CAMBIOS'
        }}
      </ion-button>

      <ion-button
        expand="block"
        fill="outline"
        class="action-btn btn-cancel"
        [disabled]="isLoading"
        (click)="cancelar()"
      >
        CANCELAR
      </ion-button>

    </div>

  </div>

</ion-content>
