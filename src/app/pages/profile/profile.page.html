<ion-header class="ion-no-border">
  <ion-toolbar class="head-toolbar">

    <ion-buttons slot="start">
      <ion-back-button
        defaultHref="/principal/tabs/tab1"
        color="light">
      </ion-back-button>
    </ion-buttons>

    <ion-title>Perfil de Usuario</ion-title>

  </ion-toolbar>
</ion-header>

<ion-content>

  <div class="dashboard-wrapper">

    <!-- Tarjeta del perfil -->
    <div class="sector-card profile-card">

      <div class="profile-icon">
        <ion-icon name="person-circle-outline"></ion-icon>
      </div>

      <!-- Nombre obtenido desde el login -->
      <h2>{{ userName }}</h2>

      <!-- Correo obtenido desde el login -->
      <p>{{ userEmail }}</p>

    </div>

    <!-- Tarjeta de configuración -->
    <div class="sector-card settings-card">

      <ion-list lines="none">

        <ion-item class="custom-setting-item">

          <ion-label>
            <h3>Notificaciones Push</h3>
            <p>Recibir alertas de riego</p>
          </ion-label>

          <ion-toggle
            slot="end"
            color="primary"
            [checked]="pushNotifications"
            (ionChange)="toggleNotifications($event)">
          </ion-toggle>

        </ion-item>

        <ion-item class="custom-setting-item">

          <ion-label>
            <h3>Modo Oscuro</h3>
            <p>Interfaz del sistema</p>
          </ion-label>

          <ion-toggle
            slot="end"
            color="primary"
            [checked]="darkMode"
            (ionChange)="toggleDarkMode($event)">
          </ion-toggle>

        </ion-item>

      </ion-list>

    </div>

    <!-- Botones -->
    <div class="profile-actions">

      <ion-button
        expand="block"
        class="action-btn btn-edit"
        (click)="onEditProfile()">
        EDITAR INFORMACIÓN
      </ion-button>

      <ion-button
        expand="block"
        fill="outline"
        class="action-btn btn-logout"
        (click)="onLogout()">
        CERRAR SESIÓN
      </ion-button>

    </div>

  </div>

</ion-content>
