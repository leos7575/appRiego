<ion-header class="custom-header">

  <div class="header-safe-area"></div>

  <div class="header-row">

    <ion-back-button
      defaultHref="/principal/tabs/tab1"
      class="header-back-button"
      aria-label="Regresar"
    ></ion-back-button>

    <h1 class="header-title">
      Perfil de Usuario
    </h1>

  </div>

</ion-header>

<ion-content>

  <div class="dashboard-wrapper">

    <div class="sector-card profile-card">

      <div class="profile-icon">

        <ion-icon
          name="person-circle-outline"
        ></ion-icon>

      </div>

      <h2>
        {{ userName }}
      </h2>

      <p>
        {{ userEmail }}
      </p>

    </div>

    <div class="profile-actions">

      <ion-button
        expand="block"
        class="action-btn btn-edit"
        (click)="onEditProfile()"
      >
        EDITAR INFORMACIÓN
      </ion-button>

      <ion-button
        expand="block"
        fill="outline"
        class="action-btn btn-logout"
        (click)="onLogout()"
      >
        CERRAR SESIÓN
      </ion-button>

    </div>

  </div>

</ion-content>
