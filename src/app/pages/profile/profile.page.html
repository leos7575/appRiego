<!-- Forzamos el fondo del header aquí también -->
<ion-header class="ion-no-border" style="--background: #1E2E4F;">
  <ion-toolbar class="head-toolbar" style="--background: #1E2E4F; --color: #ffffff;">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/principal/tabs/tab1" color="light"></ion-back-button>
    </ion-buttons>
    <ion-title style="color: #ffffff;">{{ 'PROFILE.TITLE' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<!-- Forzamos el fondo oscuro aquí -->
<ion-content style="--background: #192338;">
  <div class="dashboard-wrapper" style="max-width: 600px; margin: 0 auto; padding-top: 20px;">
    
    <!-- Tarjeta de Perfil -->
    <div class="sector-card" style="background: #1E2E4F; border: 1px solid #31487A; padding: 30px; border-radius: 20px; align-items: center; display: flex; flex-direction: column; margin-bottom: 20px;">
      <div style="width: 80px; height: 80px; background: #31487A; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #8FB3E2; font-size: 3rem; margin-bottom: 15px;">
        <ion-icon name="person-circle-outline"></ion-icon>
      </div>
      <h2 style="color: #ffffff; margin: 0; font-weight: 700;">Usuario AquaControl</h2>
      <p style="color: #8FB3E2; margin: 5px 0 0 0; opacity: 0.8;">{{ userEmail }}</p>
    </div>

    <!-- Tarjeta de Selección de Idioma -->
    <div class="sector-card" style="background: #1E2E4F; border: 1px solid #31487A; padding: 20px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
      <div>
        <h3 style="color: #ffffff; margin: 0; font-weight: 700; font-size: 1.05rem;">Idioma / Language</h3>
        <p style="color: #8FB3E2; margin: 4px 0 0 0; opacity: 0.8; font-size: 0.85rem;">Selecciona el idioma del sistema</p>
      </div>
      <app-language-selector></app-language-selector>
    </div>

    <!-- Botones -->
    <div style="margin-top: 15px;">
      <ion-button expand="block" (click)="onEditProfile()" style="--background: #8FB3E2; --color: #192338; height: 50px; font-weight: 700; border-radius: 12px; margin-bottom: 15px;">{{ 'PROFILE.EDIT_INFO' | translate }}</ion-button>
      <ion-button expand="block" (click)="onLogout()" style="--background: transparent; --color: #E56363; height: 50px; font-weight: 700; border: 1px solid #E56363; border-radius: 12px;">{{ 'PROFILE.LOGOUT' | translate }}</ion-button>
    </div>

  </div>
</ion-content>
