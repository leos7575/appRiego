<ion-content [fullscreen]="true" class="desktop-bg">

  <div class="login-wrapper">

    <div class="split-card">

      <div class="split-left">

        <div class="brand-container">

          <h2 class="brand-title">
            Aqua Control
          </h2>

          <p class="brand-subtitle">
            Monitoreo y optimización inteligente
          </p>

          <img
            src="assets/img/logo.png"
            alt="Logo de Aqua Control"
            class="brand-logo"
          />

        </div>

      </div>

      <div class="split-right">

        <h1 class="main-title">
          Iniciar sesión
        </h1>

        <div class="input-group">

          <label>
            Usuario
          </label>

          <ion-input
            [value]="usuario()"
            (ionInput)="actualizarUsuario($event)"
            placeholder="Ingresa tu usuario"
            type="text"
            class="premium-input"
          ></ion-input>

        </div>

        <div class="input-group">

          <label>
            Contraseña
          </label>

          <ion-input
            [value]="password()"
            (ionInput)="actualizarPassword($event)"
            name="password"
            autocomplete="current-password"
            placeholder="Ingresa tu contraseña"
            type="password"
            required
            minlength="6"
            class="premium-input"
          >
            <ion-input-password-toggle
              slot="end"
              class="light-eye"
            ></ion-input-password-toggle>
          </ion-input>

        </div>

        <ion-button
          fill="solid"
          expand="block"
          class="neon-btn"
          (click)="mostrar()"
        >
          INICIAR SESIÓN
        </ion-button>

        <div class="forgot-container">

          <span class="text-secondary">
            ¿No tienes una cuenta?
          </span>

          <a
            routerLink="/registro"
            class="neon-link"
          >
            Regístrate ahora
          </a>

        </div>

      </div>

    </div>

  </div>

</ion-content>
